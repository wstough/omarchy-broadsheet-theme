# Broadsheet: an Omarchy theme that reads like a good newspaper.
# Every app Omarchy themes (terminal, bar, editors, btop...) gets its colors from this file.
# Every text color is drawn from a real printing/pigment ink and checked for contrast:
# run tools/check-palette.py after editing (aim: 4.5+ for text, code colors ~6).
mode = "light"

# Accent: graphite, like a pencil rule. Color is saved for meaning (errors, code).
accent = "#55524C"
selection = "#D8D2C4"
muted = "#78736A"            # thin rules, comments, inactive things

# Paper
background = "#EEEAE0"         # bone: soft, unbleached paper
dark_background = "#E6E1D6"
darker_background = "#DBD5C8"
lighter_background = "#E9E5DB"

# Ink
foreground = "#1C1B19"          # warm ink, softer than pure black
dark_foreground = "#5F5B54"    # bylines & captions
light_foreground = "#3A3835"
bright_foreground = "#000000"  # true black for emphasis

# Code & terminal colors: clear printing inks, dark enough for paper (v4 "Clear ink")
red = "#B0283A"        # crimson
orange = "#A8430F"     # vermilion
yellow = "#865900"     # ochre
green = "#22703F"      # bottle green
cyan = "#006876"       # petrol
blue = "#1F55B0"       # cobalt
magenta = "#8B2C8F"    # violet
brown = "#5A3E26"      # umber

bright_red = "#C42C41"
bright_yellow = "#8E5E00"
bright_green = "#247743"
bright_cyan = "#007383"
bright_blue = "#2464CE"
bright_magenta = "#A835AD"

# Window borders: graphite hairline on the focused window, a lighter gray rule for the rest
hyprland_active_border = "rgb(55524C)"
hyprland_inactive_border = "rgb(BFB9AC)"
