# Broadsheet — an Omarchy theme that reads like a good newspaper.
# Every app Omarchy themes (terminal, bar, editor, btop...) gets its colors from this file.
mode = "light"

# The one spot of color: a deep "link" blue
accent = "#1A4F8B"
selection = "#D5CEBE"
muted = "#8E897F"            # thin gray rules, comments, inactive things

# Paper
background = "#EEEAE0"         # bone: soft, unbleached paper
dark_background = "#E6E1D6"
darker_background = "#DBD5C8"
lighter_background = "#E9E5DB"

# Ink
foreground = "#1C1B19"          # warm ink, softer than pure black
dark_foreground = "#66635D"    # bylines & captions
light_foreground = "#3A3835"
bright_foreground = "#000000"  # true black for emphasis

# Terminal colors, kept as dark, desaturated printing inks
red = "#A3231F"
yellow = "#86650F"
orange = "#9C4F1B"
green = "#3D6A29"
cyan = "#2A6B73"
blue = "#1A4F8B"
magenta = "#74386A"
brown = "#5C3A1E"

bright_red = "#C0392F"
bright_yellow = "#A07B14"
bright_green = "#4F8236"
bright_cyan = "#35838C"
bright_blue = "#2E66A8"
bright_magenta = "#8E4A82"

# Window borders: the accent blue marks the focused window, a faint rule for the rest
hyprland_active_border = "rgb(1A4F8B)"
hyprland_inactive_border = "rgba(8e897f66)"
